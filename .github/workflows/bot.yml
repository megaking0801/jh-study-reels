name: comment-dm-bot
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check＝只列出留言不私訊；dry＝模擬；run＝正式"
        default: check
        type: choice
        options: [check, dry, run]
concurrency: bot
permissions:
  contents: write
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IG_BOT_TOKEN: ${{ secrets.IG_BOT_TOKEN }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      BOT_RECAPS: ${{ secrets.BOT_RECAPS }}
      MODE: ${{ github.event.inputs.mode || 'run' }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          case "$MODE" in check) python3 ig_bot.py --check;; dry) python3 ig_bot.py --dry;; *) python3 ig_bot.py;; esac
      - name: Save state
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add bot_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "bot state" && git pull --rebase -q && git push)
